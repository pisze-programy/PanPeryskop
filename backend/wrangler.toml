name = "panperyskop-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Daily event seed: load next day's events early morning Europe/Warsaw.
# 02:00 UTC = 04:00 CEST (summer) / 03:00 CET (winter).
[triggers]
crons = [ "0 2 * * *" ]

[[d1_databases]]
binding = "DB"
database_name = "panperyskop-db"
database_id = "c9fed854-29bc-4ea7-9242-d0a7bc6abee0"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "panperyskop-media"

[vars]
APPLE_CLIENT_ID = "com.panperyskop.PanPeryskop"
# GOOGLE_CLIENT_ID = ""  # set once an OAuth client is created in Google Cloud Console

[env.prod]
[env.prod.vars]
ENVIRONMENT = "production"
CORS_ORIGIN = "panperyskop://app"
APPLE_CLIENT_ID = "com.panperyskop.PanPeryskop"

[[env.prod.d1_databases]]
binding = "DB"
database_name = "panperyskop-db"
database_id = "c9fed854-29bc-4ea7-9242-d0a7bc6abee0"

[[env.prod.r2_buckets]]
binding = "MEDIA"
bucket_name = "panperyskop-media"
