name: PanPeryskop

settings:
  MARKETING_VERSION: "1.3.1"
  CURRENT_PROJECT_VERSION: 107
  DEVELOPMENT_TEAM: "3UKH2QRFKZ"
  SWIFT_VERSION: "6.0"
  INFOPLIST_KEY_CFBundleDisplayName: "Pan Peryskop"

options:
  developmentLanguage: pl
  bundleIdPrefix: pl.piszeprogramy
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"

packages:
  LazyPager:
    path: vendor/LazyPager
  KeychainAccess:
    url: https://github.com/kishikawakatsumi/KeychainAccess
    from: 4.2.0
  FacebookSDK:
    url: https://github.com/facebook/facebook-ios-sdk
    from: 18.1.1

targets:
  PanPeryskop:
    type: application
    platform: iOS
    sources:
      - path: PanPeryskop
        excludes:
          - "Resources/CityThumbs"
      - path: PanPeryskop/Resources/CityThumbs
        type: folder
    dependencies:
      - package: LazyPager
        product: LazyPager
      - package: KeychainAccess
        product: KeychainAccess
      - package: FacebookSDK
        product: FacebookCore
    info:
      path: PanPeryskop/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleURLTypes:
          - CFBundleURLName: com.panperyskop
            CFBundleURLSchemes:
              - panperyskop
              - fb1316364160498615
        FacebookAppID: "1316364160498615"
        FacebookClientToken: "b2e9d80b3cf0de4e2666209e39b06251"
        FacebookDisplayName: Pan Peryskop iOS
        NSUserTrackingUsageDescription: "Pomaga nam mierzyć skuteczność reklam i docierać do osób, które szukają miejskich atrakcji."
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: v9wttpbfk9.skadnetwork
          - SKAdNetworkIdentifier: n38lu8286q.skadnetwork
        ITSAppUsesNonExemptEncryption: false
        LSApplicationQueriesSchemes:
          - comgooglemaps
          - fbapi
          - fb-messenger-share-api
        # Provider links often use cleartext http; the in-app browser must load them.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
    entitlements:
      path: PanPeryskop/SignInWithApple.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pl.piszeprogramy.panperyskop
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: ["UIInterfaceOrientationPortrait","UIInterfaceOrientationPortraitUpsideDown","UIInterfaceOrientationLandscapeLeft","UIInterfaceOrientationLandscapeRight"]
        GENERATE_INFOPLIST_FILE: YES

  PanPeryskopTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PanPeryskopTests
    dependencies:
      - target: PanPeryskop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pl.piszeprogramy.panperyskop.tests
        GENERATE_INFOPLIST_FILE: YES

# XcodeGen defaults Run to Debug; keep Release so running from Xcode matches the shipped build.
schemes:
  PanPeryskop:
    build:
      targets:
        PanPeryskop: all
        PanPeryskopTests: [test]
    run:
      config: Release
    test:
      config: Debug
      targets:
        - PanPeryskopTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
