name: PanPeryskop

settings:
  MARKETING_VERSION: "1.0"
  CURRENT_PROJECT_VERSION: 1
  DEVELOPMENT_TEAM: ""
  SWIFT_VERSION: "6.0"

options:
  bundleIdPrefix: com.panperyskop
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"

packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-native
    from: 6.12.0
  LazyPager:
    url: https://github.com/gh123man/SwiftUI-LazyPager
    from: 1.0.0
  KeychainAccess:
    url: https://github.com/kishikawakatsumi/KeychainAccess
    from: 4.2.2
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher
    from: 8.0.0

targets:
  PanPeryskop:
    type: application
    platform: iOS
    sources:
      - path: PanPeryskop
    dependencies:
      - package: MapLibre
      - package: LazyPager
      - package: KeychainAccess
      - package: Kingfisher
    info:
      path: PanPeryskop/Info.plist
    settings:
      base:
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: "Potrzebujemy dostępu do aparatu, aby nagrywać treści."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Zapisujemy kopię zapasową nagrania w Twojej galerii."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Potrzebujemy dostępu do galerii, aby wybierać zdjęcia i filmy."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Potrzebujemy mikrofonu do nagrywania filmów."
        GENERATE_INFOPLIST_FILE: YES
